<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大叔帶你飛 電子簽單 V2</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#eef2f6;color:#193047;margin:0}main{max-width:650px;margin:auto;background:white;padding:18px}label{display:block;margin:12px 0}input,textarea{width:100%;font:inherit;padding:10px;border:1px solid #aab7c4;border-radius:6px}button{background:#193e60;color:white;border:0;border-radius:7px;padding:12px;margin:5px 3px;font:inherit}canvas{width:100%;height:150px;border:1px solid #8293a4;touch-action:none;background:white}small{display:block}h2{font-size:19px}</style><main><h1>大叔帶你飛｜電子簽單 V2.0</h1><textarea id="paste" rows="5" placeholder="貼上完整派車單文字"></textarea><button id="parse">自動填入</button><button id="reset">下一筆訂單</button><div id="fields"></div><button id="arr">現在到達</button><button id="done">現在完成</button><h2>乘客簽名</h2><canvas id="guest" width="1000" height="300"></canvas><button onclick="clearPad('guest')">清除乘客簽名</button><h2>司機簽名</h2><canvas id="driver" width="1000" height="300"></canvas><button onclick="clearPad('driver')">清除司機簽名</button><hr><button id="save">儲存簽單圖片</button><button id="share">分享簽單圖片</button><small>訂單只在目前頁面處理；司機資料儲存在此瀏覽器。分享前請確認資料。</small><p id="status" role="status"></p></main><script>
const $=id=>document.getElementById(id);const keys=['公司','服務案號','廠商編號','服務日期','約定時間','航班','客戶姓名','聯絡電話','接送類型','上車地點','目的地','乘客及行李','車型','司機','司機電話','車號','到達時間','完成時間','備註'];const personal=['司機','司機電話','車號'];const f={};for(const k of keys){let l=document.createElement('label');l.textContent=k;let i=document.createElement('input');l.append(i);$('fields').append(l);f[k]=i;if(personal.includes(k)){try{i.value=localStorage.getItem(k)||''}catch{}i.onchange=()=>{try{localStorage.setItem(k,i.value)}catch{}}}}
const aliases={'客戶':'客戶姓名','會員姓名':'客戶姓名','電話':'聯絡電話','班機':'航班','指定地點':'目的地','服務需求':'接送類型','日期':'服務日期','時間':'約定時間','服務車號':'車號','下車地點':'目的地'};$('parse').onclick=()=>{let extra=[];let n=0;for(let line of $('paste').value.split(/\n/)){let m=line.trim().match(/^[-•\s]*([^：:]+)[：:]\s*(.*)$/);if(!m)continue;let k=m[1].trim(),v=m[2].trim();k=aliases[k]||k;if(k==='乘客'||k==='行李'){extra.push(v);continue}if(f[k]){f[k].value=v;n++}}if(extra.length)f['乘客及行李'].value=extra.join('、');$('status').textContent='已填入 '+n+' 個欄位，請核對資料。'};function now(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`} $('arr').onclick=()=>f['到達時間'].value=now();$('done').onclick=()=>f['完成時間'].value=now();const ink={};function clearPad(id){let c=$(id);c.getContext('2d').clearRect(0,0,c.width,c.height);ink[id]=false}for(let id of ['guest','driver']){let c=$(id),ctx=c.getContext('2d'),active=false;ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{active=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...pos(e))};c.onpointermove=e=>{if(!active)return;ctx.lineTo(...pos(e));ctx.stroke();ink[id]=true};c.onpointerup=c.onpointercancel=()=>active=false}
$('reset').onclick=()=>{if(!confirm('清除本次訂單及簽名？'))return;for(let k of keys)if(!personal.includes(k))f[k].value='';$('paste').value='';clearPad('guest');clearPad('driver');$('status').textContent='已清除訂單'};
function output(){for(let k of ['服務日期','客戶姓名','到達時間','完成時間'])if(!f[k].value.trim()){alert('請填寫'+k);f[k].focus();return}if(!ink.guest){alert('請先完成乘客簽名');return}let c=document.createElement('canvas');c.width=1200;let ctx=c.getContext('2d');ctx.font='28px sans-serif';function wrap(s){let a=[''];for(let ch of s){let i=a.length-1;if(ctx.measureText(a[i]+ch).width>850)a.push(ch);else a[i]+=ch}return a}let rows=keys.map(k=>[k,wrap(f[k].value||'—')]);c.height=150+rows.reduce((s,r)=>s+Math.max(58,r[1].length*38+20),0)+410;ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#193047';ctx.font='bold 40px sans-serif';ctx.fillText('大叔帶你飛｜電子服務簽單',40,75);let y=120;for(let [k,lines] of rows){let h=Math.max(58,lines.length*38+20);ctx.fillStyle='#eef2f6';ctx.fillRect(40,y,230,h);ctx.strokeStyle='#aab7c4';ctx.strokeRect(40,y,1120,h);ctx.fillStyle='#193047';ctx.font='28px sans-serif';ctx.fillText(k,55,y+38);lines.forEach((v,i)=>ctx.fillText(v,285,y+38+i*38));y+=h}for(let [i,id] of ['guest','driver'].entries()){let x=40+i*560;ctx.strokeRect(x,y+20,560,340);ctx.fillText(i?'司機簽名':'乘客簽名',x+15,y+60);ctx.drawImage($(id),x+10,y+75,540,250)}return c}async function act(share){let c=output();if(!c)return;let b=await new Promise(r=>c.toBlob(r,'image/png'));if(!b)return;let file=new File([b],'電子簽單.png',{type:'image/png'});if(share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}}let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000);$('status').textContent='已要求下載圖片，請至下載資料夾確認。'}$('save').onclick=()=>act(false);$('share').onclick=()=>act(true);
</script></html>
