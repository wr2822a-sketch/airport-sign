<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大叔帶你飛 電子簽單</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#eef2f5;color:#172b40;margin:0;padding:16px}main{max-width:600px;margin:auto;background:white;padding:20px;border-radius:16px}label{display:block;margin-top:12px}input,textarea{width:100%;font:inherit;padding:9px;border:1px solid #aaa;border-radius:6px}button{font:inherit;padding:12px;background:#173b58;color:white;border:0;border-radius:8px;margin:6px 4px 6px 0}canvas{width:100%;height:180px;border:1px solid #aaa;touch-action:none}small{color:#555}</style><main><h2>大叔帶你飛｜電子簽單</h2><div id="fields"></div><button id="arr">現在到達</button><button id="done">現在完成</button><p>乘客簽名</p><canvas id="sig" width="900" height="360"></canvas><button id="clear">清除重簽</button><button id="save">儲存簽單圖片</button><p><small>資料僅在本頁處理，重新整理會清空。請確認派單公司接受電子簽名。</small></p><div id="preview"></div></main><script>const defs=[['公司',''],['服務案號',''],['服務日期',''],['約定時間',''],['航班',''],['客戶姓名',''],['聯絡電話',''],['接送類型',''],['上車地點',''],['目的地',''],['乘客及行李',''],['司機','王林川'],['司機電話','0928627039'],['車號','RGJ-9931'],['到達時間',''],['完成時間',''],['備註','']];const inputs=defs.map(([name,value])=>{let l=document.createElement('label');l.textContent=name;let i=document.createElement('input');i.value=value;l.append(i);document.querySelector('#fields').append(l);return i});const now=()=>new Date().toLocaleString('zh-TW',{hour12:false});arr.onclick=()=>inputs[14].value=now();done.onclick=()=>inputs[15].value=now();let c=document.querySelector('#sig'),x=c.getContext('2d'),down=false,signed=false;x.lineWidth=5;x.lineCap='round';function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...pos(e))};c.onpointermove=e=>{if(down){x.lineTo(...pos(e));x.stroke();signed=true}};c.onpointerup=c.onpointercancel=()=>down=false;clear.onclick=()=>{x.clearRect(0,0,c.width,c.height);signed=false};save.onclick=()=>{if(!signed){alert('請先簽名');return}let o=document.createElement('canvas'),g=o.getContext('2d');o.width=1000;g.font='28px sans-serif';let lines=[];defs.forEach(([n],j)=>{let s=n+'：'+inputs[j].value,t='';for(let a of s){if(g.measureText(t+a).width>920){lines.push(t);t=''}t+=a}lines.push(t)});o.height=180+lines.length*42+360;g.fillStyle='white';g.fillRect(0,0,o.width,o.height);g.fillStyle='#172b40';g.font='bold 40px sans-serif';g.fillText('大叔帶你飛｜電子簽單',40,65);g.font='28px sans-serif';lines.forEach((s,j)=>g.fillText(s,40,120+j*42));let y=130+lines.length*42;g.fillText('乘客簽名',40,y);g.drawImage(c,40,y+20,900,360);let url=o.toDataURL('image/png'),a=document.createElement('a');a.href=url;a.download='電子簽單.png';a.click();let im=new Image();im.src=url;im.style.width='100%';document.querySelector('#preview').replaceChildren(im)};</script></html>
